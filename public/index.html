<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cumbria Equipment Tracker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;color:#163b40;background:#eaf1f2}header{background:#103e44;color:white;padding:18px;display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:21px;margin:0}button{border:0;border-radius:9px;background:#087d80;color:white;font:600 14px system-ui;padding:11px 15px;cursor:pointer}button.alt{background:#dfe9ea;color:#164248}input,select,textarea{width:100%;padding:11px;border:1px solid #b7c9cc;border-radius:8px;font:inherit}label{display:block;margin:12px 0;font-weight:600;font-size:13px}label>*{margin-top:5px}.hidden{display:none!important}#gate{min-height:80vh;display:grid;place-items:center;padding:20px}.card{background:white;border-radius:16px;padding:26px;box-shadow:0 5px 30px #0001;width:min(100%,480px)}.muted{color:#657d82;font-size:13px}.error{color:#b22536}.bar{display:flex;gap:9px;flex-wrap:wrap;padding:12px;background:white;align-items:center}.bar input{flex:1;min-width:180px}.bar select{width:auto}#map{height:calc(100dvh - 215px);min-height:420px}.pin{height:24px;width:24px;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 1px 6px #0007}.overlay{position:fixed;inset:0;background:#001c20aa;display:grid;place-items:center;padding:14px;z-index:9999}.overlay .card{width:min(100%,720px);max-height:92dvh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entry{border-bottom:1px solid #ddd;padding:10px 0}.actions{display:flex;gap:10px;justify-content:flex-end;margin:15px 0}.legend{padding:10px;background:white}@media(max-width:600px){.row{grid-template-columns:1fr}#map{height:calc(100dvh - 270px)}}
</style></head><body><header><h1>⚡ Cumbria Equipment Tracker</h1><span id="who"></span></header><section id="gate"><div class="card"><h2>Secure sign in</h2><p class="muted">Only approved users can access equipment locations.</p><form id="login"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p class="error" id="loginError"></p><button style="width:100%">Log in</button></form><p><button class="alt" onclick="registerForm()">Request access</button></p></div></section><section id="dashboard" class="hidden"><div class="bar"><b id="stats"></b><small class="muted">Initial positions approximate; confirm on site.</small></div><div class="bar"><input id="search" placeholder="Search equipment or location"><select id="filter"><option value="all">All statuses</option><option value="available">🟢 Available</option><option value="ready">🟠 Awaiting startup</option><option value="inuse">🔴 In use</option></select><button onclick="map.fitBounds(bounds)">Cumbria</button><button onclick="listAssets()">Equipment list</button><button id="adminBtn" class="hidden" onclick="adminPanel()">Admin</button><button class="alt" onclick="logout()">Log out</button></div><div id="map"></div><div class="legend">🟢 Available &nbsp; 🟠 Awaiting startup / planned power &nbsp; 🔴 Currently in use</div></section><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closePanel()"><div class="card" id="content"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),bounds=[[54,-3.8],[55.2,-2.3]],colors={available:'#159d67',ready:'#f4a51b',inuse:'#d93c49'},labels={available:'Available',ready:'Awaiting startup / planned power',inuse:'Currently in use'};let user=null,assets=[],map,markers=[];
async function api(action,data,method='POST'){let r=await fetch('/.netlify/functions/api?action='+encodeURIComponent(action),{method,data===undefined?undefined:{headers:{'content-type':'application/json'},body:JSON.stringify(data)},credentials:'same-origin'});let v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function panel(html){$('content').innerHTML=html;$('overlay').classList.remove('hidden')}function closePanel(){$('overlay').classList.add('hidden')}
$('login').onsubmit=async e=>{e.preventDefault();try{let v=await api('login',Object.fromEntries(new FormData(e.target)));user=v.user;await start()}catch(x){$('loginError').textContent=x.message}};
function registerForm(){panel(`<h2>Request access</h2><form id="register"><label>Username<input name="username" required pattern="[A-Za-z0-9_]{3,32}"></label><label>Password (12+ characters)<input name="password" type="password" required minlength="12"></label><p class="error" id="regError"></p><div class="actions"><button type="button" class="alt" onclick="closePanel()">Cancel</button><button>Request access</button></div></form>`);$('register').onsubmit=async e=>{e.preventDefault();try{let v=await api('register',Object.fromEntries(new FormData(e.target)));$('regError').style.color='green';$('regError').textContent=v.message}catch(x){$('regError').textContent=x.message}}}
async function start(){if(!user)user=(await api('me',undefined,'GET')).user;$('gate').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent=user.username+' · '+user.role;$('adminBtn').classList.toggle('hidden',user.role!=='admin');if(!map){map=L.map('map').fitBounds(bounds);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map)}setTimeout(()=>map.invalidateSize(),100);await refresh()}
async function refresh(){assets=(await api('assets',undefined,'GET')).assets;render()}
function render(){markers.forEach(m=>map.removeLayer(m));markers=[];let q=$('search').value.toLowerCase(),f=$('filter').value;for(let a of assets.filter(a=>(f==='all'||a.status===f)&&[a.id,a.power,a.fleet,a.base,a.location,a.area,a.comment].join(' ').toLowerCase().includes(q))){let m=L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${colors[a.status]||'#777'}"></div>`,iconSize:[26,26],iconAnchor:[12,25]})}).addTo(map);m.bindTooltip(`<b>${esc(a.id)} · ${esc(a.power)}</b><br>${esc(labels[a.status])}<br>Current: ${esc(a.location)}<br>${esc(a.comment)}`);m.bindPopup(`<b>${esc(a.id)}</b><br>${esc(a.location)}<br><button onclick="detail('${a.id}')">View / update</button>`);markers.push(m)}$('stats').textContent=`${assets.length} items · 🟢 ${assets.filter(a=>a.status==='available').length} · 🟠 ${assets.filter(a=>a.status==='ready').length} · 🔴 ${assets.filter(a=>a.status==='inuse').length}`}
$('search').oninput=()=>user&&render();$('filter').onchange=()=>user&&render();
function listAssets(){panel(`<h2>Equipment list</h2>${assets.map(a=>`<div class="entry"><b>${esc(a.id)} — ${esc(a.power)}</b><br>${esc(a.location)} · ${esc(labels[a.status])} <button onclick="detail('${a.id}')">Open</button></div>`).join('')}<div class="actions"><button onclick="closePanel()">Close</button></div>`)}
async function detail(id){let a=assets.find(x=>x.id===id);if(!a)return;let [hr,fr]=await Promise.all([fetch('/.netlify/functions/api?action=history&id='+encodeURIComponent(id)).then(r=>r.json()),fetch('/.netlify/functions/api?action=files&id='+encodeURIComponent(id)).then(r=>r.json())]);panel(`<h2>${esc(a.id)} · ${esc(a.power)} ${esc(a.type||'Generator')}</h2><p><b>Fleet:</b> ${esc(a.fleet)} &nbsp; <b>Manufacturer:</b> ${esc(a.manufacturer)} &nbsp; <b>Serial:</b> ${esc(a.serial)}<br><b>Base:</b> ${esc(a.base)} &nbsp; <b>Owner:</b> ${esc(a.owner)}<br><b>Hire:</b> ${esc(a.hire)} &nbsp; <b>Area:</b> ${esc(a.area)}</p><form id="edit"><div class="row"><label>Status<select name="status">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${a.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Activity<select name="event"><option>Location / status update</option><option>Moved</option><option>Started use</option><option>Stopped use</option><option>Fuel / condition check</option><option>Service completed</option></select></label></div><div class="row"><label>Current location<input name="location" value="${esc(a.location)}"></label><label>Postcode<input name="postcode" value="${esc(a.postcode)}"></label></div><label>what3words<input name="w3w" value="${esc(a.w3w)}" placeholder="///word.word.word"></label><div class="row"><label>Latitude<input name="lat" type="number" step="any" required value="${a.lat}"></label><label>Longitude<input name="lng" type="number" step="any" required value="${a.lng}"></label></div><p class="muted">what3words is recorded but does not automatically move the marker. Enter verified GPS coordinates to position accurately.</p><div class="row"><label>Fuel<input name="fuel" value="${esc(a.fuel)}"></label><label>Condition<input name="condition" value="${esc(a.condition)}"></label></div><label>Latest service<input name="service" type="date" value="${esc(a.service)}"></label><label>Comments<textarea name="comment" rows="3">${esc(a.comment)}</textarea></label><p id="editError" class="error"></p><div class="actions"><button type="button" class="alt" onclick="closePanel()">Close</button><button>Save update</button></div></form><h3>Photos / attachments</h3><form id="upload"><input name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required><button>Upload</button></form><div>${(fr.files||[]).map(x=>`<div class="entry"><button class="alt" onclick="downloadFile('${esc(x.key)}')">${esc(x.name)}</button> · ${esc(x.username)}</div>`).join('')}</div><h3>Activity history</h3>${(hr.history||[]).map(x=>`<div class="entry">${esc(x.created)} · ${esc(x.username)} · ${esc(x.event)}<br>${esc(x.location)} · ${esc(x.comment)}</div>`).join('')||'<p class="muted">No updates yet.</p>'}`);$('edit').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await api('save',{id,...d});await refresh();await detail(id)}catch(x){$('editError').textContent=x.message}};$('upload').onsubmit=async e=>{e.preventDefault();let f=e.target.file.files[0];if(!f||f.size>3*1024*1024)return alert('File must be 3MB or smaller');try{let r=await fetch('/.netlify/functions/api?action=upload&id='+encodeURIComponent(id)+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'content-type':f.type},body:f});let v=await r.json();if(!r.ok)throw Error(v.error);await detail(id)}catch(x){alert(x.message)}}}
async function downloadFile(key){let r=await fetch('/.netlify/functions/api?action=file&key='+encodeURIComponent(key));if(!r.ok)return alert('Could not download');let url=URL.createObjectURL(await r.blob());let a=document.createElement('a');a.href=url;a.download='equipment-attachment';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function adminPanel(){try{let users=(await api('users',undefined,'GET')).users;panel(`<h2>Administrator dashboard</h2><h3>Users</h3>${users.map(u=>`<div class="entry"><b>${esc(u.username)}</b> · ${esc(u.role)} · ${u.approved?'Approved':'Pending'} ${u.role!=='admin'?`<button onclick="approve('${u.id}',${!u.approved})">${u.approved?'Revoke':'Approve'}</button>`:''}</div>`).join('')}<h3>Create engineer</h3><form id="createUser"><div class="row"><label>Username<input name="username" required></label><label>Temporary password (12+ characters)<input name="password" type="password" minlength="12" required></label></div><button>Create engineer</button></form><h3>Add equipment</h3><form id="addAsset"><div class="row"><label>Equipment ID<input name="id" required placeholder="GEN-017"></label><label>Type<input name="type" value="Generator" required></label><label>Power<input name="power" placeholder="60kVA"></label><label>Fleet number<input name="fleet"></label><label>Base<input name="base"></label><label>Location<input name="location"></label><label>Latitude<input name="lat" type="number" step="any" value="54.6"></label><label>Longitude<input name="lng" type="number" step="any" value="-2.9"></label></div><button>Add equipment</button></form><h3>Remove equipment</h3><p class="muted">Deletion removes the map record. Historical logs and attachments are retained.</p><select id="deleteId">${assets.map(a=>`<option value="${esc(a.id)}">${esc(a.id)} — ${esc(a.power)}</option>`).join('')}</select><button class="alt" onclick="deleteAsset()">Delete selected equipment</button><p class="error" id="adminError"></p><div class="actions"><button onclick="closePanel()">Close</button></div>`);$('createUser').onsubmit=async e=>{e.preventDefault();try{await api('createUser',Object.fromEntries(new FormData(e.target)));await adminPanel()}catch(x){$('adminError').textContent=x.message}};$('addAsset').onsubmit=async e=>{e.preventDefault();try{await api('addAsset',Object.fromEntries(new FormData(e.target)));await refresh();await adminPanel()}catch(x){$('adminError').textContent=x.message}}}catch(x){alert(x.message)}}
async function approve(id,approved){try{await api('approve',{id,approved});await adminPanel()}catch(x){alert(x.message)}}async function deleteAsset(){let id=$('deleteId').value;if(!confirm('Delete '+id+'?'))return;try{await api('deleteAsset',{id});await refresh();await adminPanel()}catch(x){alert(x.message)}}async function logout(){await api('logout',{});location.reload()}api('me',undefined,'GET').then(v=>{user=v.user;start()}).catch(()=>{});setInterval(()=>{if(user)refresh().catch(()=>{})},15000);
</script></body></html>
